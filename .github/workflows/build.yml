name: Build APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
              pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
              libtinfo5 cmake libffi-dev libssl-dev ccache
          pip3 install --upgrade pip
          pip3 install --user Cython==0.29.36 buildozer

      - name: Run Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Crear directorio de licencias de Android SDK de forma anticipada
          mkdir -p ~/.android
          echo "### License accepted" > ~/.android/repositories.cfg
          # Forzar aceptación de licencias mediante el comando sdkmanager si estuviera disponible, o dejar que buildozer avance
          buildozer android debug
